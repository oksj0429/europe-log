<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | 유럽, 지나온 길</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <h1>회원가입</h1>
    <p class="sub">수업 프로젝트용 데모입니다. 실제 사용하는 비밀번호는 입력하지 마세요. 비밀번호는 저장되지 않습니다.</p>
    <form class="box" name="signupForm" id="signupForm">
      <label for="uid">아이디 (영문/숫자 4~12자)</label>
      <input type="text" id="uid" name="uid">
      <label for="pw">비밀번호 (6자 이상)</label>
      <input type="password" id="pw" name="pw">
      <label for="pw2">비밀번호 확인</label>
      <input type="password" id="pw2" name="pw2">
      <label for="email">이메일</label>
      <input type="email" id="email" name="email">
      <label>관심 국가</label>
      <div class="checks" id="interests"></div>
      <div class="err" id="signupErr"></div>
      <button class="btn primary" type="submit">가입하기</button>
    </form>
  </main>
  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
